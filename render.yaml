# Render Blueprint — ByteMarket API + managed PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# Apply from the Render dashboard: New + → Blueprint → pick this repo.
#
# This repository IS the backend, so the service builds from the repo root
# (no rootDir). Nothing is stored relative to a monorepo subdirectory.
#
# No secrets are stored in this file:
#   - DATABASE_URL is injected from the bytemarket-db database below.
#   - JWT_SECRET is generated by Render on first deploy (generateValue: true).
#   - ADMIN_EMAIL / ADMIN_PASSWORD are entered as Render secrets (sync: false).
#   - CORS_ORIGIN is the public Netlify production origin, not a secret.
# To rotate a secret later, regenerate it in the Render dashboard.

databases:
  - name: bytemarket-db
    databaseName: bytemarket
    user: bytemarket
    plan: free

services:
  - type: web
    name: bytemarket-api
    runtime: node
    plan: free
    # NODE_ENV=production is set below; force dev deps so tsc/tsx are available
    # while building (they are not needed at runtime).
    buildCommand: npm ci --include=dev && npm run build
    # Migrations + idempotent, password-preserving seed run at boot against
    # DATABASE_URL. The compiled runners need no tsx and use committed SQL in
    # ./drizzle. The seed fails fast if ADMIN_EMAIL / ADMIN_PASSWORD are not
    # configured, so a missing secret blocks the deploy instead of shipping a
    # default admin.
    #
    # NOTE: `preDeployCommand` (the modern replacement for `releaseCommand`) is
    # NOT available on the Free plan, so the migration/seed step is folded into
    # startCommand. On a paid plan, move this to:
    #   preDeployCommand: npm run db:migrate:prod && npm run db:seed:prod
    #   startCommand: npm start
    startCommand: npm run db:migrate:prod && npm run db:seed:prod && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bytemarket-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://bytemarket.netlify.app
      - key: JWT_SECRET
        generateValue: true
      # Token lifetimes (compact durations: s/m/h/d). Values match the env.ts
      # defaults; listed explicitly so they are visible/editable in the Render
      # dashboard. Adjust here instead of changing code.
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 1h
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      # Initial admin account used by the seed. Enter both as secrets in the
      # Render dashboard; `sync: false` keeps them out of this repo and
      # preserves them across subsequent deploys. If ADMIN_PASSWORD is rotated
      # later, the seed never overwrites the existing admin (see README).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
