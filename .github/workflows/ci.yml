name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test + integration, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bytemarket
          POSTGRES_PASSWORD: bytemarket_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytemarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create + migrate their own bytemarket_test database.
      TEST_DATABASE_URL: postgresql://bytemarket:bytemarket_dev_password@localhost:5432/bytemarket_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
